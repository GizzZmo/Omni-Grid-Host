<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Omni-Grid Host 3.0 — Live Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@19/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background:#0a0a0f; color:#e0e0ff; font-family:monospace; margin:0; }
    .scanline { background:repeating-linear-gradient(0deg,rgba(0,0,0,.15),rgba(0,0,0,.15) 1px,transparent 1px,transparent 2px); pointer-events:none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

function Widget({ title, color, children, onClose }) {
  return (
    <div className="border border-cyan-500/30 rounded-lg bg-black/40 backdrop-blur h-full flex flex-col overflow-hidden">
      <div className="h-8 flex items-center justify-between px-3 bg-black/60 border-b border-cyan-500/20">
        <span className={`text-xs font-bold ${color}`}>{title}</span>
        <button onClick={onClose} className="text-red-400 text-xs">✕</button>
      </div>
      <div className="flex-1 p-3 text-xs overflow-auto">{children}</div>
    </div>
  );
}

function App() {
  const [bus, setBus] = useState([]);
  const emit = (type, source, data) => setBus(b => [...b.slice(-8), { type, source, data, t: Date.now() }]);

  return (
    <div className="h-screen flex flex-col">
      <div className="scanline absolute inset-0 z-50" />
      <header className="h-14 flex items-center justify-between px-6 border-b border-cyan-500/30 bg-black/50">
        <div className="flex items-center gap-3">
          <div className="w-8 h-8 bg-cyan-400 text-black font-bold flex items-center justify-center rounded">OG</div>
          <h1 className="text-xl font-bold tracking-widest text-cyan-400">OMNI-GRID <span className="text-pink-400">HOST 3.0</span></h1>
        </div>
        <div className="text-xs text-cyan-300">POLYGLUT MICROKERNEL · CROSS-TALK BUS</div>
      </header>

      <main className="flex-1 grid grid-cols-2 grid-rows-2 gap-3 p-3">
        <Widget title="NEURAL & AGENTIC CORE" color="text-cyan-300" onClose={() => {}}>
          <div className="space-y-2">
            <div>MultiAgentHub · HoverMind · Ai_shell</div>
            <textarea className="w-full h-16 bg-black/50 border border-cyan-500/30 rounded p-1" placeholder="Agent task..." />
            <button onClick={() => emit('ai/agent-task','neural',{prompt:'analyze'})} className="px-2 py-1 bg-pink-500/40 rounded">Dispatch</button>
            <div className="text-white/40">Python Sidecar ready</div>
          </div>
        </Widget>
        <Widget title="SONIC & NEURAL DAW" color="text-green-400" onClose={() => {}}>
          <div className="space-y-2">
            <div>NAW · DSP4Guitar · TABFRET</div>
            <div className="flex gap-1 h-12 items-end">
              {[40,70,50,90].map((h,i)=><div key={i} className="flex-1 bg-green-500/40" style={{height:h+'%'}}/>)}
            </div>
            <button onClick={() => emit('audio/pcm','sonic',{stems:4})} className="px-2 py-1 bg-green-500/40 rounded">Emit Buffer</button>
            <div className="text-white/40">C++ WASM AudioWorklet</div>
          </div>
        </Widget>
        <Widget title="SECOPS & BIOMETRIC" color="text-red-400" onClose={() => {}}>
          <div className="space-y-2">
            <div>AutoSec · Face-Recon · pcap</div>
            <button onClick={() => emit('sec/alert','secops',{anomaly:'spike'})} className="px-2 py-1 bg-red-500/40 rounded">Simulate Alert</button>
            <div className="text-white/40">C++ libpcap Daemon</div>
          </div>
        </Widget>
        <Widget title="DEVOPS FORGE" color="text-yellow-300" onClose={() => {}}>
          <div className="space-y-2">
            <div>CyberEditor · autofix-engine</div>
            <pre className="bg-black/50 p-1 text-green-300 text-[10px]">git patch staged</pre>
            <button onClick={() => emit('git/patch','dev',{files:2})} className="px-2 py-1 bg-yellow-500/40 rounded">Stage Fix</button>
          </div>
        </Widget>
      </main>

      <footer className="h-8 px-6 flex items-center justify-between text-[10px] bg-black/70 border-t border-cyan-500/20 text-cyan-300">
        <span>LOCAL-FIRST · REACT 19 · ZUSTAND · EXTENSION SDK</span>
        <span>{bus.length ? `LAST: ${bus[bus.length-1].type} ← ${bus[bus.length-1].source}` : 'BUS IDLE'}</span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
